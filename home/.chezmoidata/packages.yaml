# Packages installed by chezmoi. Add a line here, then run `chezmoi apply` (or `chezmoi update`
# on the other machines): the install script runs again by itself whenever this list changes.
packages:
  # macOS and Linux/WSL, with Homebrew
  brew:
    - fish
    - starship
    - chezmoi
    - zoxide # `z <part of a name>` jumps to a folder you've been to
    - fzf # fuzzy finder: Ctrl+R history, Ctrl+T files, Alt+C folders
    - eza # ls with colours, icons and git status (ls, ll, la, lt)
    - bat # cat with syntax highlighting and line numbers
    - ripgrep # `rg <text>` searches inside files, fast, skipping .gitignore'd files
    - fd # `fd <name>` finds files by name, fast, skipping .gitignore'd files
    - lazygit # git in a full-screen interface (`lg`)
    - git-delta # readable diffs for git and lazygit
  # macOS only (apps)
  brewCasks:
    - wezterm
    - font-jetbrains-mono-nerd-font
  # Windows, with winget
  winget:
    - Git.Git
    - GitHub.cli
    - Microsoft.PowerShell
    - Starship.Starship
    - twpayne.chezmoi
    - wez.wezterm
    - Microsoft.VisualStudioCode
    - ajeetdsouza.zoxide
    - junegunn.fzf
    - eza-community.eza
    - sharkdp.bat
    - BurntSushi.ripgrep.MSVC
    - sharkdp.fd
    - JesseDuffield.lazygit
    - dandavison.delta
  # Windows: JetBrainsMono Nerd Font, straight from the Nerd Fonts releases on GitHub
  # (winget's version is too old for some icons). Bump the version to update it.
  nerdFont:
    version: v3.5.1
  # Windows, PowerShell 7 modules (from the PowerShell Gallery)
  psModules:
    - PSFzf # plugs fzf into PowerShell's Ctrl+R / Ctrl+T
