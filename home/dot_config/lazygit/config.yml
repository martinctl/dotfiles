# lazygit config, loaded through LG_CONFIG_FILE (same place on every OS).
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
git:
  # Diffs drawn by delta, light or dark like the terminal, side by side when the view is wide enough.
  # `|` cycles to plain git output.
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never {{if gt .width 160}}--side-by-side{{end}}
      name: delta
    - type: rawGit
      name: git
gui:
  # File icons in the lists (needs a Nerd Font, which the terminal has)
  nerdFontsVersion: "3"
keybinding:
  universal:
    # Tab / Shift+Tab switch the tabs of a panel (Files - Worktrees - Submodules…):
    # the default [ and ] need AltGr on AZERTY keyboards. Arrows still move between panels.
    togglePanel: <disabled>
    prevBlock: [<left>, h]
    nextBlock: [<right>, l]
    # lazygit still adds these legacy defaults (Tab / Shift+Tab) to the two lines above: turn them off
    prevBlock-alt2: <disabled>
    nextBlock-alt2: <disabled>
    nextTab: <tab>
    prevTab: <backtab>
